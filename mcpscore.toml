# mcpscore rule configuration — https://docs.mcpscore.dev
#
# The gate lives here rather than in the workflow so a local run
# (`mcpscore --config mcpscore.toml --env QASE_API_TOKEN --stdio node build/index.js`)
# judges the server by exactly the rules CI judges it by.

[gate]
# Fail on any failed rule at HIGH or above. A percentage alone cannot tell a
# lost security rule from a lost cosmetic one; this can.
fail_on = "high"

[rules]
# The prompt catalogue is static — defined at build time, never changing while
# the server runs — so there is nothing to notify about and we do not declare
# prompts.listChanged. Left on, it would put a permanently red line in every
# report, which is how real findings start getting skipped.
capability_prompts_list_changed = "off"

# server/discover advertises only modern revisions, by the SDK's design: the
# doc on the handler says "supportedVersions lists only modern revisions
# (2025-era versions are negotiated via initialize)". We serve both eras, so
# this rule sees a discover naming 2026-07-28 alone and reports the legacy
# revision as missing. There is nothing to fix on our side short of overriding
# the SDK's own server/discover handler, so the rule is off rather than left
# to read as a defect.
protocol_version_supported_versions_include_negotiated = "off"

# NOT turned off, deliberately: readiness_2026_unsupported_version_error fails,
# and it should. The SDK answers an unknown protocol version with -32022 only
# on the modern-only path (`legacy: 'reject'`); we run `legacy: 'stateless'`,
# so an unknown version falls through to the legacy leg instead. Satisfying the
# rule means refusing every client still on 2025-11-25. This red line is the
# honest price of dual-era support, and it should disappear on its own the day
# we drop the legacy era — not before.
