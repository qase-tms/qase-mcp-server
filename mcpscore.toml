# mcpscore rule configuration — https://docs.mcpscore.dev
#
# The gate lives here rather than in the workflow so a local run
# (`mcpscore --config mcpscore.toml --env QASE_API_TOKEN --stdio node build/index.js`)
# judges the server by exactly the rules CI judges it by.

[gate]
# Fail on any failed rule at HIGH or above. A percentage alone cannot tell a
# lost security rule from a lost cosmetic one; this can.
fail_on = "high"

[rules]
# The prompt catalogue is static — defined at build time, never changing while
# the server runs — so there is nothing to notify about and we do not declare
# prompts.listChanged. Left on, it would put a permanently red line in every
# report, which is how real findings start getting skipped.
capability_prompts_list_changed = "off"
